<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jonathan Costa | Advocacia Especializada</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="/css/header.css" />
    <link rel="stylesheet" href="/css/index.css" />
</head>

<body>

    <!-- O header é injetado aqui via JavaScript, a partir do arquivo header.html -->
    <div id="header-placeholder"></div>

    <main>
        <section class="hero" id="inicio">
            <div class="hero-container">
                <div class="hero-content">
                    <h1>Excelência jurídica para decisões que exigem segurança.</h1>
                    <p class="hero-subtitle">
                        Atuação jurídica especializada, estratégica e personalizada para
                        proteger seus interesses e construir soluções sólidas.
                    </p>
                    <div class="hero-actions">
                        <a href="#contato" class="btn btn-primary">Fale com um Advogado</a>
                        <a href="#escritorio" class="btn btn-secondary">Conheça o Escritório</a>
                    </div>
                </div>

                <div class="hero-media">
                    <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1200&q=80"
                        alt="Sala de reuniões do escritório de advocacia" />
                </div>
            </div>
        </section>
    </main>

    <script>
        // Carrega o header.html dentro do #header-placeholder
        fetch("/components/header.html")
            .then((res) => res.text())
            .then((html) => {
                document.getElementById("header-placeholder").innerHTML = html;
                initMenuToggle();
            })
            .catch((err) => console.error("Erro ao carregar o header:", err));

        // Controla a abertura/fechamento do menu mobile
        function initMenuToggle() {
            const toggle = document.querySelector(".menu-toggle");
            const nav = document.querySelector(".main-nav");

            if (!toggle || !nav) return;

            toggle.addEventListener("click", () => {
                const isOpen = nav.classList.toggle("open");
                toggle.setAttribute("aria-expanded", isOpen);
            });
        }

    </script>
</body>

</html>
